<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mr. Longnose – Comic Quiz (P6)</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Chalkboard SE","Comic Sans MS","Marker Felt","Trebuchet MS",sans-serif;
  background-color:#ffe14d;
  background-image:radial-gradient(#f2b300 22%,transparent 24%);
  background-size:14px 14px;
  color:#111;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
button,input,textarea{font-family:inherit}
.ink{background:#fff;border:4px solid #111;border-radius:16px;box-shadow:6px 6px 0 #111}
.btn{font-weight:900;font-size:18px;border:4px solid #111;border-radius:12px;padding:10px 16px;background:#fff;
  box-shadow:4px 4px 0 #111;cursor:pointer;touch-action:manipulation;color:#111;line-height:1.1;user-select:none;-webkit-user-select:none}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #111}
.btn:disabled{opacity:.45;cursor:default}
.btn.yellow{background:#ffd400}.btn.red{background:#ff4d4d;color:#fff}.btn.blue{background:#2fd3ff}
.btn.green{background:#52e07a}.btn.pink{background:#ff8fc7}.btn.big{font-size:24px;padding:14px 26px}
.btn.small{font-size:15px;padding:7px 11px;border-width:3px;box-shadow:3px 3px 0 #111}

/* header */
header.top{position:fixed;top:0;left:0;right:0;height:70px;display:flex;align-items:center;gap:10px;
  padding:0 12px;padding-top:env(safe-area-inset-top);background:#d7262e;border-bottom:5px solid #111;z-index:20;
  background-image:radial-gradient(rgba(0,0,0,.18) 20%,transparent 22%);background-size:9px 9px}
.logo{display:flex;align-items:center;gap:6px;color:#fff;font-weight:900;font-size:22px;letter-spacing:1px;
  text-shadow:3px 3px 0 #111,-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111;white-space:nowrap}
.logo svg{width:52px;height:52px}
.pills{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.pill{border:3px solid #111;border-radius:30px;padding:5px 11px;font-weight:900;font-size:14px;background:#fff;white-space:nowrap}
.pill.on{background:#ffd400;transform:rotate(-3deg) scale(1.08);box-shadow:3px 3px 0 #111}
.pill.done{background:#52e07a}
.scorebox{background:#fff;border:3px solid #111;border-radius:10px;padding:5px 10px;font-weight:900;white-space:nowrap}
.btn.read{background:#2fd3ff;font-size:19px;animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-4deg)}96%{transform:rotate(4deg)}}
@media (max-width:900px){.logo span{display:none}.pill .lbl{display:none}}
@media (max-width:600px){.pills{display:none}}

main{padding:88px 14px 30px;max-width:1180px;margin:0 auto;min-height:100vh}
.banner{display:inline-block;background:#ffd400;border:4px solid #111;padding:6px 18px;font-weight:900;font-size:26px;
  box-shadow:5px 5px 0 #111;transform:rotate(-2deg);margin:4px 0 16px;text-transform:uppercase}
.banner small{font-size:16px;display:block;text-transform:none}
.grid2{display:grid;grid-template-columns:minmax(220px,32%) 1fr;gap:20px;align-items:start}
.hostcol{display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:86px}
.hostcol .host{width:100%;max-width:300px;height:auto}
@media (orientation:portrait),(max-width:820px){
  .grid2{grid-template-columns:1fr}
  .hostcol{position:static;flex-direction:row;align-items:flex-end}
  .hostcol .host{max-width:150px}
}
.bubble{position:relative;background:#fff;border:4px solid #111;border-radius:22px;padding:12px 16px;font-weight:700;font-size:18px;box-shadow:4px 4px 0 #111}
.bubble:after{content:"";position:absolute;left:40px;bottom:-22px;border:12px solid transparent;border-top:16px solid #111}
.bubble:before{content:"";position:absolute;left:44px;bottom:-12px;border:8px solid transparent;border-top:12px solid #fff;z-index:2}
@media (orientation:portrait),(max-width:820px){
  .bubble:after{left:-26px;bottom:20px;border:12px solid transparent;border-right:18px solid #111}
  .bubble:before{left:-14px;bottom:24px;border:8px solid transparent;border-right:12px solid #fff}
}
.card{padding:20px}
.qnum{font-weight:900;color:#d7262e;font-size:18px}
.qtext{font-size:26px;font-weight:900;margin:6px 0 16px;line-height:1.25}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;font-size:20px;min-height:70px;display:flex;gap:10px;align-items:center}
.opt .let{flex:0 0 38px;height:38px;border-radius:50%;border:3px solid #111;display:flex;align-items:center;justify-content:center;background:#ffd400}
.opt.right{background:#52e07a}.opt.wrong{background:#ff7b7b}
.explain{margin-top:16px;padding:12px 14px;border:3px dashed #111;border-radius:12px;background:#fff8c8;font-size:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.progress{height:16px;border:3px solid #111;border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}
.progress div{height:100%;background:repeating-linear-gradient(45deg,#d7262e 0 10px,#ff5a5a 10px 20px);transition:width .4s}

/* pop fx */
.popfx{position:fixed;left:50%;top:45%;z-index:45;pointer-events:none;font-size:92px;font-weight:900;color:#ffd400;
  -webkit-text-stroke:4px #111;text-shadow:7px 7px 0 #111;animation:pop 1s forwards;white-space:nowrap}
.popfx.bad{color:#ff4d4d}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-25deg);opacity:0}
 25%{transform:translate(-50%,-50%) scale(1.2) rotate(-8deg);opacity:1}
 70%{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}
 100%{transform:translate(-50%,-70%) scale(.9) rotate(-6deg);opacity:0}}

/* character anims */
.nose{transform-box:fill-box;transform-origin:0% 50%;animation:bob 1.8s ease-in-out infinite}
.twitchy .nose{animation:twitch .35s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg) translateX(3px)}}
@keyframes twitch{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg) translateX(5px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.talk{transform-box:fill-box;transform-origin:center;animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.1)}}
.floaty{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* part 2 */
.seq-item{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;background:#fff;border:4px solid #111;
  border-radius:14px;box-shadow:4px 4px 0 #111;touch-action:none;user-select:none;-webkit-user-select:none;font-size:19px;font-weight:700;position:relative}
.seq-item .grip{flex:0 0 34px;height:34px;border-radius:8px;background:#ffd400;border:3px solid #111;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:grab}
.seq-item.dragging{z-index:10;box-shadow:10px 12px 0 rgba(0,0,0,.55);background:#fffbd6;transform-origin:center}
.seq-item.ok{background:#b9f5c9}.seq-item.no{background:#ffc2c2}
.seq-item .num{font-weight:900;color:#d7262e;flex:0 0 26px}
.arrows{display:flex;flex-direction:column;gap:4px;margin-left:auto}
.arrows button{border:2px solid #111;background:#fff;border-radius:6px;font-size:13px;padding:2px 8px;touch-action:manipulation}

/* part 3 */
.swipe-zone{position:relative;height:380px;display:flex;align-items:center;justify-content:center}
.swipe-card{position:absolute;width:min(520px,92%);min-height:260px;padding:24px;background:#fff;border:5px solid #111;border-radius:22px;
  box-shadow:8px 8px 0 #111;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;justify-content:center;
  text-align:center;font-size:27px;font-weight:900;cursor:grab;
  background-image:radial-gradient(rgba(47,211,255,.25) 20%,transparent 22%);background-size:12px 12px}
.swipe-card.under{transform:scale(.94) translateY(14px) rotate(2deg);opacity:.85;z-index:0;background:#fff4b0}
.tag{position:absolute;top:16px;font-size:30px;font-weight:900;border:4px solid;border-radius:10px;padding:2px 12px;transform:rotate(-12deg)}
.tag.t{left:16px;color:#18a33f;border-color:#18a33f}.tag.f{right:16px;color:#d7262e;border-color:#d7262e;transform:rotate(12deg)}

/* part 4 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn.on{background:#ffd400;transform:rotate(-2deg)}
.canvas-wrap{position:relative;border:5px solid #111;border-radius:14px;overflow:hidden;background:#fff;box-shadow:6px 6px 0 #111}
canvas.pad{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid #111;cursor:pointer;touch-action:manipulation}
.swatch.on{outline:4px solid #2fd3ff;outline-offset:2px}
.stage{position:relative;width:100%;aspect-ratio:4/3;background:#222;border:5px solid #111;border-radius:14px;overflow:hidden;box-shadow:6px 6px 0 #111;touch-action:none}
.stage video,.stage .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage video{transform:scaleX(-1)}
.stage .noseimg{position:absolute;touch-action:none;cursor:move;-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.4))}
.stage .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;gap:12px;font-size:20px}
textarea.write{width:100%;min-height:170px;font-size:21px;padding:14px;border:4px solid #111;border-radius:14px;line-height:1.5;
  background:repeating-linear-gradient(#fff 0 30px,#cfe7ff 30px 31.5px);resize:vertical}
.chip{display:inline-block;border:3px solid #111;border-radius:20px;padding:5px 12px;margin:4px;background:#fff;font-weight:700;cursor:pointer;touch-action:manipulation}
.check{font-size:19px;font-weight:700;margin:4px 0}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,30,.7);display:flex;align-items:center;justify-content:center;padding:12px;
  animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.reader{width:min(1120px,100%);height:94vh;height:94dvh;display:flex;flex-direction:column;background:#fffdf3;border:5px solid #111;border-radius:18px;
  box-shadow:10px 10px 0 #111;overflow:hidden;animation:slidein .25s}
@keyframes slidein{from{transform:translateY(30px) scale(.97)}to{transform:none}}
.reader-top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#2fd3ff;border-bottom:5px solid #111;flex-wrap:wrap}
.reader-top h2{margin:0;font-size:26px;font-weight:900;text-shadow:2px 2px 0 #fff;flex:1;min-width:140px}
.reader-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:46% 1fr;gap:18px;padding:18px;touch-action:pan-y;align-content:start}
@media (orientation:portrait),(max-width:820px){.reader-body{grid-template-columns:1fr}}
.scene{width:100%;height:auto;border:5px solid #111;border-radius:12px;background:#fff;box-shadow:5px 5px 0 #111;display:block}
.chapter{font-size:30px;font-weight:900;color:#d7262e;margin:0 0 10px;text-shadow:2px 2px 0 #111;-webkit-text-stroke:1px #111}
.story p{margin:0 0 16px;line-height:1.6}
.story mark{background:#ffd400;padding:0 4px;border-radius:4px;font-weight:900}
.vocab{margin-top:10px;border:3px dashed #111;border-radius:12px;padding:10px 12px;background:#e9fbff;font-size:17px}
.reader-bottom{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:5px solid #111;background:#ffd400;flex-wrap:wrap}
.dots{display:flex;gap:8px;flex:1;justify-content:center}
.dot{width:20px;height:20px;border-radius:50%;border:3px solid #111;background:#fff;cursor:pointer;touch-action:manipulation}
.dot.on{background:#d7262e;transform:scale(1.25)}

/* start & results */
.hero{display:grid;grid-template-columns:40% 1fr;gap:24px;align-items:center}
@media (orientation:portrait),(max-width:820px){.hero{grid-template-columns:1fr}.hero .host{max-width:300px;margin:0 auto;display:block}}
.title-big{font-size:58px;font-weight:900;line-height:1;color:#ffd400;-webkit-text-stroke:3px #111;text-shadow:6px 6px 0 #111;margin:0 0 10px;transform:rotate(-2deg)}
.name-in{font-size:24px;padding:12px;border:4px solid #111;border-radius:12px;width:100%;max-width:380px}
.parts-list{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.parts-list li{background:#fff;border:3px solid #111;border-radius:12px;padding:8px 12px;font-size:18px;font-weight:700}
.stars{font-size:64px;letter-spacing:8px;filter:drop-shadow(3px 3px 0 #111)}
.cert{padding:22px;text-align:center;background:#fff;border:6px double #111;border-radius:18px;box-shadow:8px 8px 0 #111;
  background-image:radial-gradient(rgba(215,38,46,.12) 20%,transparent 22%);background-size:12px 12px}
table.break{width:100%;border-collapse:collapse;font-size:19px;margin-top:10px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #111;border-top-color:#d7262e;border-radius:50%;animation:sp .7s linear infinite;margin-right:8px}@keyframes sp{to{transform:rotate(360deg)}}
table.break td{border-bottom:2px dashed #111;padding:8px}
.muted{color:#444;font-size:16px}
.halftone-tag{display:inline-block;background:#111;color:#ffd400;padding:2px 10px;border-radius:6px;font-weight:900;transform:rotate(-2deg)}
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ================= STORY ================= */
const STORY = [
  { title: "Meet Mr. Longnose", scene: "studio",
    text: [
      "Every Saturday night, families all over Hong Kong switched on their TVs to watch **Superstar Saturday**. The host wore a shiny blue suit, a white shirt and a red tie with black spots. He always held a silver microphone.",
      "His real name was Mr. Lung, but everybody called him **Mr. Longnose**. Why? Because his nose was so long that it reached the edge of the stage before the rest of him did!",

  { title: "SMACK!", scene: "lift",

      "At lunch, his nose dipped right into his bowl of wonton noodles. Splash! Soup went everywhere.",
      "\"Oh dear,\" he **sighed**, wiping his nose with a napkin. \"Why can't I have a normal nose like everyone else?\""
    ],
    vocab: [["sighed", "let out a long breath because you are sad or tired"]] },
  { title: "CLICK! CLICK!", scene: "news",
    text: [
      "Before the show, a newspaper photographer came backstage. **CLICK! CLICK!** His camera flashed again and again.",
      "The next morning, the **headline** said: \"Is This the Longest Nose in Hong Kong?\" At the MTR station, some children pointed at the picture and **giggled**.",

    ],
    vocab: [["special", "different from others in a good way"]] },
  { title: "Sniff, Sniff... Danger!", scene: "smoke",
    text: [
      "In the middle of the live show, Mr. Longnose suddenly stopped talking. Sniff, sniff. His long nose could smell something nobody else could: **smoke**!",

      "\"Everybody, please walk **calmly** to the exits!\" he **announced** into his microphone. The crew put out the small fire quickly, and nobody was hurt."

    vocab: [["calmly", "in a quiet, relaxed way without panic"], ["announced", "said something loudly so that everyone could hear"]] },
  { title: "WOW!", scene: "wow",
    text: [

      "The next day, the newspaper had a new headline: \"The Nose That Knows!\" Mr. Longnose stood **proudly** in front of the camera. CLICK! This time, he did not want to hide.",

    ],
    vocab: [["proudly", "feeling happy and confident about yourself"]] }

/* ================= QUESTIONS ================= */
const Q1 = [
  { q: "What was Mr. Longnose's job?", o: ["A TV show host", "A newspaper photographer", "A firefighter", "A noodle chef"], a: 0, why: "Page 1: He was the host of 'Superstar Saturday'." },
  { q: "What happened when he turned around too quickly in the lift?", o: ["He dropped his microphone", "His nose hit the door", "He fell asleep", "The lift stopped"], a: 1, why: "Page 2: SMACK! His nose hit the metal door." },
  { q: "What fell into his wonton noodles at lunch?", o: ["His tie", "His microphone", "His nose", "His newspaper"], a: 2, why: "Page 2: His nose dipped right into his bowl." },
  { q: "How did Mr. Longnose feel when the children giggled at the newspaper picture?", o: ["Proud", "Excited", "Sleepy", "Embarrassed"], a: 3, why: "Page 3: His cheeks turned red and he wanted to hide." },

  { q: "What did his long nose smell during the live show?", o: ["Wonton noodles", "Smoke", "Flowers", "Perfume"], a: 1, why: "Page 5: A hot stage light started to burn the curtain." },

];
const SEQ = [
  { id: 1, t: "Mr. Longnose's nose hits the lift door. SMACK!" },
  { id: 2, t: "His nose dips into his wonton noodles." },
  { id: 3, t: "A photographer takes pictures of him backstage." },
  { id: 4, t: "Children at the MTR station giggle at the newspaper." },
  { id: 5, t: "Mei Mei gives him a drawing at the stage door." },
  { id: 6, t: "He smells smoke during the live show." },
  { id: 7, t: "The newspaper calls him 'The Nose That Knows!'" }
];
const TF = [
  { s: "Mr. Longnose's real name is Mr. Lung.", t: true, why: "Yes! Everybody called Mr. Lung 'Mr. Longnose'." },
  { s: "Superstar Saturday was on every Sunday morning.", t: false, why: "It was on every Saturday night." },
  { s: "His tie is red with black spots.", t: true, why: "Correct — a red tie with black polka dots!" },
  { s: "Mr. Longnose felt proud when the children giggled.", t: false, why: "He felt embarrassed and wanted to hide." },
  { s: "Mei Mei said his nose was special.", t: true, why: "She said, 'Your nose is special.'" },
  { s: "A big fire burnt down the whole studio.", t: false, why: "It was a small fire and the crew put it out quickly." },
  { s: "He told the audience to walk calmly to the exits.", t: true, why: "He announced it into his microphone." },
  { s: "At the end, Mr. Longnose still wanted to hide.", t: false, why: "This time he did NOT want to hide — he stood proudly!" }
];
const MAX = { p1: Q1.length, p2: SEQ.length, p3: TF.length, p4: 6 };

const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTsVE1p9cObYk16dtA-rRF88ZoufQ5a4IqP1QTYjsCOL7XG3psFJbx2CxEJm71Ihz0/exec";

/* ================= SOUND ================= */
const audio = { ctx: null };
function beep(type) {
  try {
    if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const c = audio.ctx; if (c.state === "suspended") c.resume();
    const notes = { good: [523, 659, 784], bad: [220, 150], click: [880], page: [600, 820], win: [523, 659, 784, 1046, 1318] }[type] || [440];

/* ================= HELPERS ================= */
function shuffle(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function rich(t) { return t.split(/(\*\*[^*]+\*\*)/g).map((s, i) => s.startsWith("**") ? <mark key={i}>{s.slice(2, -2)}</mark> : <React.Fragment key={i}>{s}</React.Fragment>); }
function plain(t) { return t.replace(/\*\*/g, ""); }
function downloadURL(url, name) { const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function useUid() { return React.useId().replace(/[^a-zA-Z0-9]/g, ""); }

const NOSE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80"><path d="M10 24 Q22 8 46 14 L188 22 Q214 28 208 46 Q200 64 178 58 L44 56 Q14 56 10 40 Z" fill="#f6c89f" stroke="#111" stroke-width="6" stroke-linejoin="round"/><circle cx="188" cy="40" r="11" fill="#ef8f7f" opacity=".7"/><path d="M56 26 L170 31" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".75"/><ellipse cx="172" cy="51" rx="7" ry="3" fill="#6b3b2a"/></svg>`;
const NOSE_URL = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(NOSE_SVG);

function burstPts(r1, r2, n) { const p = []; for (let i = 0; i < n * 2; i++) { const a = Math.PI * i / n; const r = i % 2 ? r2 : r1; p.push((Math.cos(a) * r).toFixed(1) + "," + (Math.sin(a) * r).toFixed(1)); } return p.join(" "); }
function Burst({ x, y, r = 60, text, fill = "#ffd400", tc = "#d7262e", rot = -8, fs = 26 }) {
  return (
    <g transform={`translate(${x} ${y}) rotate(${rot})`}>
      <polygon points={burstPts(r, r * 0.7, 13)} fill={fill} stroke="#111" strokeWidth="5" strokeLinejoin="round" />
      <text textAnchor="middle" dy={fs * 0.35} fontSize={fs} fontWeight="900" fill={tc} stroke="#111" strokeWidth="2.5" style={{ paintOrder: "stroke" }} fontFamily="Chalkboard SE, Comic Sans MS, sans-serif">{text}</text>
    </g>
  );
}

/* ================= STORY MODAL ================= */
function StoryModal({ page, setPage, onClose, sfx }) {
  const [fs, setFs] = useState(22);
  const [speaking, setSpeaking] = useState(false);
  const [openVocab, setOpenVocab] = useState(true);
  const bodyRef = useRef(null);
  const swipe = useRef(null);
  const pg = STORY[page];

  const stopSpeak = () => { try { window.speechSynthesis.cancel(); } catch (e) {} setSpeaking(false); };
  const go = (n) => { if (n < 0 || n >= STORY.length) return; stopSpeak(); setPage(n); sfx("page"); if (bodyRef.current) bodyRef.current.scrollTop = 0; };
  const speak = () => {
    if (!("speechSynthesis" in window)) return;
    if (speaking) { stopSpeak(); return; }
    const u = new SpeechSynthesisUtterance(pg.title + ". " + pg.text.map(plain).join(" "));
    u.lang = "en-GB"; u.rate = 0.9; u.onend = () => setSpeaking(false);
    window.speechSynthesis.speak(u); setSpeaking(true);
  };
  useEffect(() => {
    const k = (e) => { if (e.key === "ArrowRight") go(page + 1); if (e.key === "ArrowLeft") go(page - 1); if (e.key === "Escape") close(); };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  });
  useEffect(() => () => stopSpeak(), []);
  const close = () => { stopSpeak(); onClose(); };

  return (
    <div className="modal" role="dialog" aria-modal="true" aria-label="Read the story" onPointerDown={(e) => { if (e.target === e.currentTarget) close(); }}>
      <div className="reader">
        <div className="reader-top">
          <h2>📖 Mr. Longnose</h2>
          <button className="btn small" onClick={() => setFs(f => Math.max(16, f - 2))} aria-label="Smaller text">A−</button>
          <button className="btn small" onClick={() => setFs(f => Math.min(34, f + 2))} aria-label="Bigger text">A+</button>
          <button className="btn small yellow" onClick={speak}>{speaking ? "⏹ Stop" : "🔊 Read aloud"}</button>
          <button className="btn red" onClick={close}>✕ Back to Quiz</button>
        </div>
        <div className="reader-body" ref={bodyRef}
          onPointerDown={(e) => { swipe.current = { x: e.clientX, y: e.clientY }; }}
          onPointerUp={(e) => {
            if (!swipe.current) return; const dx = e.clientX - swipe.current.x, dy = e.clientY - swipe.current.y; swipe.current = null;
            if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) go(page + (dx < 0 ? 1 : -1));
          }}>
          <div><Scene kind={pg.scene} key={page} /><p className="muted" style={{ textAlign: "center" }}>Page {page + 1} of {STORY.length} · swipe to turn pages</p></div>
          <div className="story" style={{ fontSize: fs }}>
            <h3 className="chapter" style={{ color: "#ffd400" }}>{page + 1}. {pg.title}</h3>
            {pg.text.map((t, i) => <p key={i}>{rich(t)}</p>)}
            {pg.vocab && (
              <div className="vocab">
                <button className="btn small blue" onClick={() => setOpenVocab(v => !v)}>📚 Word Box {openVocab ? "▲" : "▼"}</button>
                {openVocab && <ul style={{ margin: "8px 0 0", paddingLeft: 22 }}>{pg.vocab.map(([w, m]) => <li key={w}><b>{w}</b> – {m}</li>)}</ul>}
              </div>
            )}
          </div>
        </div>
        <div className="reader-bottom">
          <button className="btn" onClick={() => go(page - 1)} disabled={page === 0}>◀ Prev</button>
          <div className="dots">{STORY.map((_, i) => <button key={i} className={"dot" + (i === page ? " on" : "")} onClick={() => go(i)} aria-label={"Page " + (i + 1)} />)}</div>
          {page < STORY.length - 1 ? <button className="btn green" onClick={() => go(page + 1)}>Next ▶</button>
            : <button className="btn green" onClick={close}>Done ✓</button>}
        </div>
      </div>
    </div>
  );
}

function Part1({ addScore, fx, sfx, onDone }) {
  const [qs] = useState(() => shuffle(P1_POOL).slice(0, 3));
  const [i, setI] = useState(0);
  const [drag, setDrag] = useState(null);
  const [msg, setMsg] = useState(null);
  const [locked, setLocked] = useState(false);
  const noseRef = useRef(null);
  const start = useRef(null);
  const timer = useRef(null);
  const q = qs[i];
  useEffect(() => () => clearTimeout(timer.current), []);

  const down = (e, k) => {
    if (locked) return;
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (er) {}
    start.current = { x: e.clientX, y: e.clientY };
    setDrag({ k, dx: 0, dy: 0 });
  };
  const move = (e) => {
    if (!start.current) return;
    setDrag(d => d && { ...d, dx: e.clientX - start.current.x, dy: e.clientY - start.current.y });
  };
  const up = (e) => {
    if (!start.current || !drag) { start.current = null; return; }
    const k = drag.k;
    start.current = null; setDrag(null);
    const r = noseRef.current.getBoundingClientRect(), m = 12;
    const hit = e.clientX > r.left - m && e.clientX < r.right + m && e.clientY > r.top - m && e.clientY < r.bottom + m;
    if (!hit) return;
    if (k === q.answer) {
      setLocked(true); addScore("p1", 1); sfx("good"); fx("GREAT!");
      setMsg({ ok: true, t: "✅ Yes! The " + JOBS.find(j => j.k === k).label + " is perfect for the interview!" });
      timer.current = setTimeout(() => {
        setMsg(null); setLocked(false);
        if (i < qs.length - 1) setI(i + 1); else onDone();
      }, 1500);
    } else {
      sfx("bad"); fx("OOPS!", true);
      setMsg({ ok: false, t: "❌ Hmm, a " + JOBS.find(j => j.k === k).label + " isn't right. Try again!" });
    }
  };
  const shock = !!drag;
  return (
    <div className="grid2">
      <div className="hostcol">
        <div ref={noseRef} style={{ width: "100%", maxWidth: 300, outline: drag ? "4px dashed #d7262e" : "none", outlineOffset: 4, borderRadius: 16 }}>
          <MrLongnose className="host" mood={shock ? "shock" : "happy"} talking={!shock && !msg} />
        </div>
        <div className="bubble">{q.prompt}</div>
      </div>
      <div>
        <div className="banner">Part 1 · Job Interview<small>Drag the right person onto Mr. Longnose</small></div>
        <div className="progress"><div style={{ width: (i / qs.length * 100) + "%" }} /></div>
        <div className="ink card">
          <div className="qnum">Question {i + 1} / {qs.length}</div>
          <div className="qtext">Who should Mr. Longnose interview?</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(110px,1fr))", gap: 12 }}>
            {JOBS.map(j => {
              const isD = drag && drag.k === j.k;
              return (
                <div key={j.k}
                  onPointerDown={(e) => down(e, j.k)} onPointerMove={move} onPointerUp={up} onPointerCancel={() => { start.current = null; setDrag(null); }}
                  style={{
                    touchAction: "none", userSelect: "none", WebkitUserSelect: "none", cursor: "grab", textAlign: "center",
                    background: "#fff", border: "4px solid #111", borderRadius: 14, padding: "8px 4px", boxShadow: isD ? "10px 12px 0 rgba(0,0,0,.5)" : "4px 4px 0 #111",
                    position: "relative", zIndex: isD ? 30 : 1,
                    transform: isD ? `translate(${drag.dx}px,${drag.dy}px) scale(1.12) rotate(-3deg)` : "none",
                    transition: isD ? "none" : "transform .2s"
                  }}>
                  <div style={{ display: "flex", justifyContent: "center" }}><JobChar k={j.k} size={84} /></div>
                  <div style={{ fontWeight: 900, fontSize: 14 }}>{j.label}</div>
                </div>
              );
            })}
          </div>
          {msg && <div className="explain" style={{ background: msg.ok ? "#d9ffe2" : "#ffe0e0" }}>{msg.t}</div>}
        </div>
      </div>
    </div>
  );
}

function Part2({ addScore, fx, sfx, onDone }) {
  const [qs] = useState(() => shuffle(P2_POOL).slice(0, 3));
  const [i, setI] = useState(0);
  const [e, setE] = useState(0);
  const [res, setRes] = useState(null);
  const sw = useRef(null);
  const q = qs[i];
  const emo = EMOTIONS[e];
  const go = (d) => { if (res) return; setE(x => (x + d + EMOTIONS.length) % EMOTIONS.length); sfx("click"); };
  const mood = { happy: "happy", sad: "sad", nervous: "shock", afraid: "shock", angry: "happy", excited: "happy" }[emo];
  const filt = emo === "angry" ? "saturate(1.8) hue-rotate(-25deg) brightness(.95)" : emo === "afraid" ? "grayscale(.35) brightness(1.05)" : "none";
  const deco = { happy: "🌟", sad: "💧", nervous: "💦", afraid: "😨 !!", angry: "💢", excited: "✨✨" }[emo];

  const down = (ev) => { if (res) return; try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (er) {} sw.current = ev.clientX; };
  const upSw = (ev) => {
    if (sw.current === null) return;
    const dx = ev.clientX - sw.current; sw.current = null;
    if (Math.abs(dx) > 45) go(dx < 0 ? 1 : -1);
  };
  const confirm = () => {
    if (res) return;
    const ok = emo === q.answer;
    setRes({ ok });
    if (ok) { addScore("p2", 1); sfx("good"); fx("YES!"); } else { sfx("bad"); fx("OOPS!", true); }
  };
  const next = () => {
    sfx("click");
    if (i < qs.length - 1) { setI(i + 1); setRes(null); setE(0); } else onDone();
  };
  return (
    <div className="grid2">
      <div className="hostcol">
        <div className="bubble">{q.prompt}</div>
      </div>
      <div>
        <div className="banner">Part 2 · Feelings<small>Swipe ◀ ▶ to change his face</small></div>
        <div className="progress"><div style={{ width: ((i + (res ? 1 : 0)) / qs.length * 100) + "%" }} /></div>
        <div className="ink card" style={{ textAlign: "center" }}>
          <div className="qnum">Question {i + 1} / {qs.length}</div>
          <div className="row" style={{ justifyContent: "center", flexWrap: "nowrap" }}>
            <button className="btn big" onClick={() => go(-1)} disabled={!!res} aria-label="Previous feeling">◀</button>
            <div onPointerDown={down} onPointerUp={upSw} onPointerCancel={() => { sw.current = null; }}
              style={{ touchAction: "none", userSelect: "none", WebkitUserSelect: "none", position: "relative", width: "min(300px,60vw)", cursor: "grab", filter: filt }}>
              <MrLongnose key={emo} mood={mood} talking={emo === "excited"} className={emo === "nervous" || emo === "afraid" ? "twitchy" : emo === "excited" ? "floaty" : ""} style={{ width: "100%", height: "auto", pointerEvents: "none" }} />
              <div style={{ position: "absolute", top: 0, left: 6, fontSize: 38, fontWeight: 900 }}>{deco}</div>
            </div>
            <button className="btn big" onClick={() => go(1)} disabled={!!res} aria-label="Next feeling">▶</button>
          </div>
          <div style={{ fontSize: 34, fontWeight: 900, margin: "8px 0", color: "#d7262e", textTransform: "uppercase" }}>{EMO_ICON[emo]} {emo}</div>
          <div className="row" style={{ justifyContent: "center", gap: 6 }}>
            {EMOTIONS.map((x, k) => <span key={x} style={{ width: 14, height: 14, borderRadius: "50%", border: "3px solid #111", background: k === e ? "#d7262e" : "#fff" }} />)}
          </div>
          {res && <div className="explain" style={{ textAlign: "left", background: res.ok ? "#d9ffe2" : "#ffe0e0" }}>
            {res.ok ? "✅ Correct! He feels " + q.answer + "." : "❌ Not quite. He feels " + q.answer + " " + EMO_ICON[q.answer]}
          </div>}
          <div className="row" style={{ marginTop: 14, justifyContent: "center" }}>
            {!res ? <button className="btn yellow big" onClick={confirm}>Confirm Feeling ✔</button>
              : <button className="btn green big" onClick={next}>{i < qs.length - 1 ? "Next ▶" : "On to Part 3 ▶"}</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

    if (pick) return;
    setPick(w);
    if (w === q.answer) { addScore("p3", 1); sfx("good"); fx("NICE!"); } else { sfx("bad"); fx("OOPS!", true); }
  };
  const next = () => {
    sfx("click");
    if (i < qs.length - 1) { setI(i + 1); setPick(null); } else onDone();
  };
  const ok = pick === q.answer;
  return (
    <PartLayout mood={pick && !ok ? "sad" : "happy"} talking={!pick}
      say={!pick ? "Look at the picture, then fill in the blank!" : ok ? "Brilliant! The perfect word!" : "Close! Check the right word below."}>
      <div className="banner">Part 3 · Describe the Scene<small>Pick the best word for the blank</small></div>
      <div className="progress"><div style={{ width: ((i + (pick ? 1 : 0)) / qs.length * 100) + "%" }} /></div>
      <div className="ink card">
        <div className="qnum">Panel {i + 1} / {qs.length}</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(240px,1fr))", gap: 16, alignItems: "start", marginTop: 8 }}>
          <Part3Scene kind={q.scene} key={i} />
          <div>
            <div className="qtext" style={{ fontSize: 24 }}>
              {parts[0]}<span style={{ display: "inline-block", minWidth: 120, borderBottom: "4px solid #111", textAlign: "center", color: pick ? (ok ? "#18a33f" : "#d7262e") : "#999" }}>{pick || "\u00a0"}</span>{parts[1]}
            </div>
            <div className="opts">
              {P3_WORDS.map(w => {
                let cls = "btn";
                if (pick && w === q.answer) cls += " green";
                else if (pick && w === pick) cls += " red";
                return <button key={w} className={cls} onClick={() => choose(w)} disabled={!!pick && w !== q.answer && w !== pick}>{w}</button>;
              })}
            </div>
          </div>
        </div>
        {pick && <div className="explain" style={{ background: ok ? "#d9ffe2" : "#ffe0e0" }}>{ok ? "✅ Correct!" : "❌ The best word is “" + q.answer + "”."}</div>}
        <div className="row" style={{ marginTop: 14 }}>
          <span className="spacer" />
          {pick && <button className="btn yellow big" onClick={next}>{i < qs.length - 1 ? "Next ▶" : "On to Part 4 ▶"}</button>}
        </div>
      </div>
    </PartLayout>
  );
}

function Part4({ flags, setFlags, sfx, fx, onDone }) {
  const [tab, setTab] = useState("draw");
  const [text, setText] = useState("");
  const padRef = useRef(null);
  const photoRef = useRef(null);

  useEffect(() => {
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    const used = WORDS.filter(w => new RegExp("\\b" + w + "\\b", "i").test(text)).length;
    const w1 = words >= 30, w2 = used >= 2;
    if (w1 !== flags.w1 || w2 !== flags.w2) {
      if ((w1 && !flags.w1) || (w2 && !flags.w2)) { fx("SUPER!"); sfx("good"); }
      setFlags(f => ({ ...f, w1, w2 }));
    }
  }, [text]);

  const drawProgress = (n) => { if (n >= 3 && !flags.draw) { setFlags(f => ({ ...f, draw: true })); fx("ARTIST!"); sfx("good"); } };
  const selfieDone = () => { if (!flags.selfie) { setFlags(f => ({ ...f, selfie: true })); fx("CLICK!"); sfx("good"); } };
  const finish = async () => {
    let drawing = null, photo = null;
    try { if (flags.draw && padRef.current) drawing = padRef.current.toDataURL("image/png"); } catch (e) {}
    try { if (photoRef.current) photo = await photoRef.current(); } catch (e) {}
    onDone({ drawing, panel: drawing, photo, letter: text });
  };
  const pts = (flags.draw ? 2 : 0) + (flags.selfie ? 2 : 0) + (flags.w1 ? 1 : 0) + (flags.w2 ? 1 : 0);
  const sayMap = { draw: "Draw a comic panel of your favourite part of my story. Add a sound-effect stamp!", selfie: "Take a selfie and give yourself a nose just like mine! Drag it into place.", write: "Write me a letter! I love reading letters from my fans." };
  return (
    <PartLayout talking say={sayMap[tab]}>
      <div className="banner">Part 4 · Creative Studio<small>Earn up to {MAX.p4} points · You have {pts}</small></div>
      <div className="tabs">
        <button className={"btn" + (tab === "draw" ? " on" : "")} onClick={() => { setTab("draw"); sfx("click"); }}>🎨 Draw {flags.draw ? "✅" : "(2)"}</button>
        <button className={"btn" + (tab === "selfie" ? " on" : "")} onClick={() => { setTab("selfie"); sfx("click"); }}>🤳 Nose Selfie {flags.selfie ? "✅" : "(2)"}</button>
        <button className={"btn" + (tab === "write" ? " on" : "")} onClick={() => { setTab("write"); sfx("click"); }}>✍️ Write {(flags.w1 ? 1 : 0) + (flags.w2 ? 1 : 0)}/2</button>
      </div>
      <div className="ink card">
        <div style={{ display: tab === "draw" ? "block" : "none" }}><DrawPad onProgress={drawProgress} padRef={padRef} /></div>
        <div style={{ display: tab === "selfie" ? "block" : "none" }}><SelfieBooth onDone={selfieDone} photoRef={photoRef} /></div>
        <div style={{ display: tab === "write" ? "block" : "none" }}><WriteBox text={text} setText={setText} /></div>
        <div className="row" style={{ marginTop: 16 }}>
          <span className="muted">You can switch tabs anytime — your work is kept.</span>
          <span className="spacer" />
          <button className="btn green big" onClick={finish}>🏆 Finish & See Results</button>
        </div>
      </div>
    </PartLayout>
  );
}

/* ================= RESULTS ================= */
function Results({ name, number, klass, scores, extras, onRestart, openStory }) {
  const total = scores.p1 + scores.p2 + scores.p3 + scores.p4;
  const max = MAX.p1 + MAX.p2 + MAX.p3 + MAX.p4;
  const pct = total / max;
  const stars = pct >= 0.85 ? 3 : pct >= 0.6 ? 2 : 1;
  const title = stars === 3 ? "SUPERSTAR READER!" : stars === 2 ? "GREAT READER!" : "RISING STAR!";
  useEffect(() => { beep("win"); }, []);
  const today = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  const [submit, setSubmit] = useState("idle");
  const clean = (s) => (s || "").replace(/[\/:*?"<>|]/g, "").trim();
  const fname = () => `${clean(name) || "Student"}_${clean(number) || "0"}_${clean(klass) || "NA"}_P6 Quiz1.pdf`;
  const makePdf = (download) => {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4" });
      const now = new Date().toLocaleString("en-GB");
      doc.setFontSize(20); doc.text("Mr. Longnose – P6 Quiz 1", 15, 20);
      doc.setFontSize(12);
      doc.text(`Name: ${name}   Number: ${number}   Class: ${klass}`, 15, 32);
      doc.text(`Date: ${now}`, 15, 39);
      doc.text(`Auto score: ${scores.p1 + scores.p2 + scores.p3} / 8  (+1 teacher mark for face = out of 10)`, 15, 46);
      let y = 58; doc.setFontSize(11);
      doc.text("Breakdown:", 15, y); y += 6;
      doc.text(`Part 1 (jobs): ${scores.p1} / 3`, 15, y); y += 6;
      doc.text(`Part 2 (feelings): ${scores.p2} / 3`, 15, y); y += 6;
      doc.text(`Part 3 (describe): ${scores.p3} / 2`, 15, y); y += 6;
      doc.text(`Part 4 feeling: ${scores.p4} / 1   Face: PENDING TEACHER CHECK (+1)`, 15, y); y += 6;
      if (extras.feel) { doc.text(`Feeling word: ${extras.feel}`, 15, y); y += 6; }
      const shot = extras.panel || extras.photo;
      if (shot) { try { doc.addImage(shot, "JPEG", 15, y + 2, 80, 60); } catch(e){} }
      if (download) doc.save(fname());
      return doc;
    } catch (e) { console.warn(e); return null; }
  };
  const doSubmit = async () => {
    setSubmit("busy");
    try {
      const doc = makePdf(false); if (!doc) throw new Error("pdf");
      const b64 = doc.output("datauristring").split(",")[1];
      const res = await fetch(GOOGLE_APPS_SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ filename: fname(), pdfBase64: b64 }) });
      if (!res.ok) throw new Error("http");
      setSubmit("done");
    } catch (e) { makePdf(true); setSubmit("fail"); }
  };
  return (
    <div className="hero">
      <div><MrLongnose className="host floaty" talking style={{ width: "100%" }} />
        <div className="bubble" style={{ marginTop: 10 }}>"{stars === 3 ? "WOW! My nose knew you could do it!" : "Well done! Remember — our differences make us special!"}"</div>
      </div>
      <div>
        <div className="cert">
          <div className="halftone-tag">CERTIFICATE OF AWESOME</div>
          <h1 className="title-big" style={{ fontSize: 46, margin: "12px 0" }}>{title}</h1>
          <div style={{ fontSize: 22 }}>This is to certify that</div>
          <div style={{ fontSize: 38, fontWeight: 900, borderBottom: "4px solid #111", display: "inline-block", padding: "0 20px", margin: "6px 0" }}>{name.trim() || "Super Reader"}</div>
          <div style={{ fontSize: 20 }}>completed the <b>Mr. Longnose</b> Comic Quiz</div>
          <div className="stars">{"⭐".repeat(stars)}{"☆".repeat(3 - stars)}</div>
          <div style={{ fontSize: 34, fontWeight: 900 }}>{total} / {max} points</div>
          <table className="break"><tbody>
            <tr><td>🎤 Part 1 · Job Interview</td><td style={{ textAlign: "right" }}><b>{scores.p1} / {MAX.p1}</b></td></tr>
            <tr><td>🧩 Part 2 · Feelings</td><td style={{ textAlign: "right" }}><b>{scores.p2} / {MAX.p2}</b></td></tr>
            <tr><td>👉 Part 3 · Describe the Scene</td><td style={{ textAlign: "right" }}><b>{scores.p3} / {MAX.p3}</b></td></tr>
            <tr><td>🎨 Part 4 · Creative Studio</td><td style={{ textAlign: "right" }}><b>{scores.p4} / {MAX.p4}</b></td></tr>
          </tbody></table>
          {(extras.drawing || extras.photo) && (
            <div className="row" style={{ justifyContent: "center", marginTop: 14 }}>
              {extras.drawing && <img src={extras.drawing} alt="My drawing" style={{ width: 200, border: "4px solid #111", borderRadius: 10 }} />}
              {extras.photo && <img src={extras.photo} alt="My nose selfie" style={{ width: 200, border: "4px solid #111", borderRadius: 10 }} />}
            </div>
          )}
          {extras.letter && extras.letter.trim() && <div className="explain" style={{ textAlign: "left", whiteSpace: "pre-wrap" }}>{extras.letter}</div>}
          <p className="muted">{today}</p>
        </div>
        <div className="ink card" style={{ marginTop: 16 }}>
          <div style={{ fontWeight: 900, fontSize: 20, marginBottom: 8 }}>📤 Send to Teacher</div>
          {submit === "idle" && <button className="btn green big" onClick={doSubmit}>📨 Submit to Teacher's Drive</button>}
          {submit === "busy" && <div className="row"><span className="spin" /> <b>Sending…</b></div>}
          {submit === "done" && <div className="explain" style={{ background: "#d9ffe2" }}>✅ Submitted to Teacher's Google Drive!</div>}
          {submit === "fail" && <div className="explain" style={{ background: "#ffe0e0" }}>⚠️ Upload failed (Wi-Fi?). PDF downloaded instead — tap Retry.</div>}
          <div className="row" style={{ marginTop: 8 }}>
            {submit !== "busy" && <button className="btn yellow" onClick={() => makePdf(true)}>💾 Download PDF</button>}
            {(submit === "fail") && <button className="btn green" onClick={doSubmit}>🔁 Retry Upload</button>}
          </div>
        </div>

        <div className="row" style={{ marginTop: 18 }}>
          <button className="btn blue" onClick={openStory}>📖 Read Story Again</button>
          <button className="btn" onClick={() => window.print()}>🖨 Print</button>
          {extras.photo && <button className="btn pink" onClick={() => downloadURL(extras.photo, "my-longnose-selfie.jpg")}>💾 Selfie</button>}
          <span className="spacer" />
          <button className="btn yellow big" onClick={onRestart}>🔁 Play Again</button>
        </div>
      </div>
    </div>
  );
}

/* ================= APP ================= */
const EMPTY_SCORES = { p1: 0, p2: 0, p3: 0, p4: 0 };
const EMPTY_FLAGS = { draw: false, selfie: false, w1: false, w2: false };

function App() {
  const [stage, setStage] = useState(0);
  const [name, setName] = useState("");
  const [number, setNumber] = useState("");
  const [klass, setKlass] = useState("");
  const [scores, setScores] = useState(EMPTY_SCORES);
  const [flags, setFlags] = useState(EMPTY_FLAGS);
  const [storyOpen, setStoryOpen] = useState(false);
  const [storyPage, setStoryPage] = useState(0);
  const [pops, setPops] = useState([]);
  const [muted, setMuted] = useState(false);
  const [extras, setExtras] = useState({});
  const [runId, setRunId] = useState(0);
  const mutedRef = useRef(muted); mutedRef.current = muted;

  const sfx = useCallback((t) => { if (!mutedRef.current) beep(t); }, []);
  const fx = useCallback((text, bad) => {
    const id = Date.now() + Math.random();
    setPops(p => [...p, { id, text, bad }]);
    setTimeout(() => setPops(p => p.filter(x => x.id !== id)), 1000);
  }, []);
  const addScore = useCallback((k, n) => setScores(s => ({ ...s, [k]: s[k] + n })), []);

  useEffect(() => {
    const p4 = (flags.draw ? 2 : 0) + (flags.selfie ? 2 : 0) + (flags.w1 ? 1 : 0) + (flags.w2 ? 1 : 0);
    setScores(s => s.p4 === p4 ? s : { ...s, p4 });
  }, [flags]);

  useEffect(() => {
    document.body.style.overflow = storyOpen ? "hidden" : "";
  }, [storyOpen]);

  useEffect(() => { window.scrollTo({ top: 0, behavior: "smooth" }); }, [stage]);

  const openStory = () => { sfx("page"); setStoryOpen(true); };
  const openStoryAt = (p) => { setStoryPage(p); sfx("page"); setStoryOpen(true); };
  const goNext = () => { setStage(s => s + 1); fx(["", "PART 2!", "PART 3!", "PART 4!", "DONE!"][stage] || "GO!"); };
  const restart = () => { setScores(EMPTY_SCORES); setFlags(EMPTY_FLAGS); setExtras({}); setRunId(r => r + 1); setStage(0); };
  const total = scores.p1 + scores.p2 + scores.p3 + scores.p4;

  const partNames = ["Quiz", "Order", "True/False", "Create"];
  return (
    <>
      <header className="top">
        <div className="logo">
          <svg viewBox="0 0 70 60" aria-hidden="true">
            <path d="M8 30 Q6 6 30 6 Q50 6 52 22 Q40 16 30 20 Q18 22 12 34 Z" fill="#7a4521" stroke="#111" strokeWidth="3" />
            <circle cx="30" cy="34" r="20" fill="#f6c89f" stroke="#111" strokeWidth="3" />
            <path d="M8 30 Q6 6 30 6 Q50 6 52 22 Q40 16 30 20 Q18 22 12 34 Z" fill="#7a4521" stroke="#111" strokeWidth="3" />
            <circle cx="28" cy="30" r="3" fill="#111" /><circle cx="40" cy="29" r="3" fill="#111" />
            <g className="nose"><path d="M36 34 L64 35 Q68 38 64 41 L36 41 Z" fill="#f6c89f" stroke="#111" strokeWidth="3" strokeLinejoin="round" /></g>
            <path d="M34 46 Q40 50 46 46" stroke="#111" strokeWidth="3" fill="none" />
          </svg>
          <span>MR. LONGNOSE</span>
        </div>
        <div className="pills">
          {partNames.map((p, k) => (
            <span key={k} className={"pill" + (stage === k + 1 ? " on" : stage > k + 1 ? " done" : "")}>{stage > k + 1 ? "✔" : k + 1} <span className="lbl">{p}</span></span>
          ))}
        </div>
        {stage === 0 && <span className="spacer" />}
        <span className="scorebox">⭐ {total}</span>
        <button className="btn small" onClick={() => setMuted(m => !m)} aria-label="Sound on/off">{muted ? "🔇" : "🔊"}</button>
        <button className="btn read" onClick={openStory}>📖 Read Story</button>
      </header>

      <main key={runId}>
        {stage === 0 && <Start name={name} setName={setName} number={number} setNumber={setNumber} klass={klass} setKlass={setKlass} onStart={() => { sfx("good"); setStage(1); fx("LET'S GO!"); }} openStory={openStory} />}
        {stage === 1 && <Part1 addScore={addScore} fx={fx} sfx={sfx} onDone={goNext} openStoryAt={openStoryAt} />}
        {stage === 2 && <Part2 addScore={addScore} fx={fx} sfx={sfx} onDone={goNext} />}
        {stage === 3 && <Part3 addScore={addScore} fx={fx} sfx={sfx} onDone={goNext} />}
        {stage === 4 && <Part4 flags={flags} setFlags={setFlags} fx={fx} sfx={sfx} onDone={(ex) => { setExtras(ex); setStage(5); }} />}
        {stage === 5 && <Results name={name} number={number} klass={klass} scores={scores} extras={extras} onRestart={restart} openStory={openStory} />}
      </main>

      {pops.map(p => <div key={p.id} className={"popfx" + (p.bad ? " bad" : "")}>{p.text}</div>)}

      {storyOpen && <StoryModal page={storyPage} setPage={setStoryPage} onClose={() => { setStoryOpen(false); sfx("click"); }} sfx={sfx} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
